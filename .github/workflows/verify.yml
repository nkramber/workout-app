name: verify

# The free checks of every pull request and of every push to `main` (D-6).
# `make verify` runs the checks of verify:lint and verify:test on the
# machine of the owner. The ruleset of `main` requires each job except
# verify:probe.
# The job verify:probe runs `make probe` for the iPhone probe (D-113). It
# is not a required check (D-114). The jobs verify:contract, verify:go,
# and verify:emulator run the product checks of work area 2.1 (D-126).
# Each one is a required check of `main` (D-127), so none has a path
# filter: a required check that does not run blocks the merge.
#
# Every action is pinned to a full commit SHA. The comment gives the tag
# that the SHA resolves to, and the date of the check with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`. Bump the SHA and the
# comment together.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "verify:lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 verified_at 2026-09-28
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 verified_at 2026-09-28
        with:
          python-version: "3.12"
      # ste-check, ref-check, lifecycle-check, and context-budget.
      - name: lint
        run: make lint

  test:
    name: "verify:test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 verified_at 2026-09-28
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 verified_at 2026-09-28
        with:
          python-version: "3.12"
      # Each test that makes a commit sets its own git identity.
      - name: test
        run: make test

  probe:
    name: "verify:probe"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 verified_at 2026-09-28
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 verified_at 2026-09-28
        with:
          node-version-file: tools/spikes/iphone_probe/.nvmrc
          cache: npm
          cache-dependency-path: tools/spikes/iphone_probe/package-lock.json
      # The system libraries of WebKit and Chromium. `make probe` then
      # downloads the browsers themselves.
      - name: browser libraries
        working-directory: tools/spikes/iphone_probe
        run: npx --yes playwright@1.63.0 install-deps chromium webkit
      # The build, and the browser tests against the local Auth emulator
      # (D-115).
      - name: probe
        run: make probe

  contract:
    name: "verify:contract"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 verified_at 2026-09-28
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 verified_at 2026-09-29
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # The breaking check reads the contract of origin/main. The
      # repository is public, so the fetch needs no credentials.
      - name: fetch main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # buf lint, the generated code in Git, and buf breaking.
      - name: contract
        run: make contract

  go:
    name: "verify:go"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 verified_at 2026-09-28
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 verified_at 2026-09-29
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # gofmt, go mod tidy, go vet, and the unit tests.
      - name: go
        run: make go-test

  emulator:
    name: "verify:emulator"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 verified_at 2026-09-28
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 verified_at 2026-09-29
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 verified_at 2026-09-28
        with:
          node-version-file: emulators/.nvmrc
          cache: npm
          cache-dependency-path: emulators/package-lock.json
      # The Firestore emulator of firebase-tools 15 needs Java 21.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 verified_at 2026-09-29
        with:
          distribution: temurin
          java-version: "21"
      # The acceptance story over the Auth and Firestore emulators. No
      # call reaches a real project (D-115).
      - name: emulator
        run: make emulator-test
