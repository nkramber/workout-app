<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The page never zooms, as in Decktome (D-120, decktome:D-624).
         This fails the WCAG 1.4.4 rule for text resize. viewport-fit=cover
         lets the shell reach each edge of the screen, and the shell pads
         itself with the safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS reads no SVG and no manifest icon for a Home Screen icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout App" />
    <title>Workout App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
